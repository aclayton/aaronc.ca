<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aaron Clayton — GitHub social card</title>
<style>
/* GitHub's social preview size, 1280x640 — the card shown when a repo link is
   shared. Same composition as card.html, re-laid out for the taller ratio. */
@font-face { font-family:"Plex Sans"; src:url("/print/fonts/plex-sans-400.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"Plex Sans"; src:url("/print/fonts/plex-sans-600.woff2") format("woff2"); font-weight:600; font-display:block; }
@font-face { font-family:"Plex Sans"; src:url("/print/fonts/plex-sans-700.woff2") format("woff2"); font-weight:700; font-display:block; }
@font-face { font-family:"Plex Mono"; src:url("/fonts/plex-mono-400.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"Plex Mono"; src:url("/fonts/plex-mono-600.woff2") format("woff2"); font-weight:600; font-display:block; }

:root{
  --bg:#f7f6fa; --fg:#191725; --muted:#5e5a72; --rule:#dcd6ea;
  --hue:268; --accent-s:62%;
  --accent-text:hsl(var(--hue) var(--accent-s) 54%);
  --hairline:hsl(var(--hue) var(--accent-s) 40% / .30);
  --type-1:1rem; --type-2:1.272rem; --type-3:1.618rem; --type-4:2.618rem; --type-5:4.236rem;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  width:1280px; height:640px; overflow:hidden; background:var(--bg); color:var(--fg);
  font-family:"Plex Sans",system-ui,sans-serif; font-size:var(--type-1); line-height:1.618;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.card{ position:relative; width:100%; height:100%; padding:64px 72px; display:flex; flex-direction:column; }

.ground{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle at 12% 6%, transparent 0 330px, var(--hairline) 330px 332px, transparent 332px),
    radial-gradient(circle at 39.5% 6%, transparent 0 330px, var(--hairline) 330px 332px, transparent 332px),
    linear-gradient(104deg, transparent 0, hsl(var(--hue) var(--accent-s) 58% / .10) 26%, transparent 66%);
}
.card > *:not(.ground){ position:relative; z-index:1; }

.top{ display:flex; align-items:center; justify-content:space-between;
      padding-bottom:20px; border-bottom:1px solid var(--rule); }
.top .mark{ width:73px; height:49px; color:var(--fg); }
.top .url{ font-family:"Plex Mono",monospace; font-size:var(--type-2); font-weight:600; color:var(--muted); }

h1{ font-size:var(--type-5); line-height:1.15; letter-spacing:-.022em; font-weight:700;
    text-wrap:balance; margin:auto 0 0; max-width:19ch; }
h1 em{ font-style:normal; color:var(--accent-text); }

.lede{ font-size:var(--type-2); color:var(--muted); margin:18px 0 0; max-width:46ch; }

.bits{ display:flex; gap:10px; margin-top:34px; padding-top:22px; border-top:1px solid var(--rule); }
.bit{ font-family:"Plex Mono",monospace; font-size:var(--type-1); font-weight:600;
      color:var(--fg); border:1px solid hsl(var(--hue) var(--accent-s) 58% / .45);
      border-radius:999px; padding:5px 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="ground"></div>

  <div class="top">
    <svg class="mark" viewBox="18 0 216 144" role="img" aria-label="Aaron Clayton">
      <path fill="currentColor" d="M18,0v144h156.02H234V0H18z M134.625,5.76c-11.049,4.608-20.677,12.123-28.068,21.392L94.207,5.76H134.625z M23.76,5.76h63.796L23.76,114.156V5.76z M23.76,138.24v-12.564L90.44,11.232l73.603,127.008H23.76z M228.24,138.24h-37.131c8.688-4.032,16.502-9.352,23.037-15.979l-5.17-3.13c-10.599,10.28-24.039,16.538-38.531,18.176L109.666,31.996c1.927-2.587,4.054-5.07,6.376-7.392c12.512-12.512,29.146-19.41,46.838-19.41c17.347,0,33.673,6.622,46.096,18.671l5.17-2.699c-6.527-6.621-14.328-11.95-23.005-15.406h37.099V138.24z"/>
    </svg>
    <div class="url">github.com/aclayton</div>
  </div>

  <h1>I make complex systems people <em>actually use</em>.</h1>
  <p class="lede">Then I take the manual work out of them. Interface where the interface matters, automation where it doesn't.</p>

  <div class="bits">
    <span class="bit">no build step</span>
    <span class="bit">no dependencies</span>
    <span class="bit">works without JS</span>
  </div>
</div>
</body>
</html>
